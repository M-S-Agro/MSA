<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="icon" type="image/x-icon" href="MSA_Favicon.jpg">
  <link rel="stylesheet" href="Style.css" /> 
  <title>Maa Santoshi Agro</title>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader">
      <img src="MAA SANTOSHI AGRO LOGO.jpg" alt="Maa Santoshi Agro Logo" class="loader-image">
      <p class="loader-title">Maa Santoshi Agro <br> At : Laikera && At : Patrapali, Kuchinda</p>
      <p class="loading-text">Loading...</p>
  </div>

  <!-- Animated Moving Background -->
  <div class="background"></div>

  <!-- Central Links Container Area -->
  <div class="center-wrapper">
    <h1>Maa Santoshi Agro – Quick Links</h1>

    <div class="button-container">
      <button onclick="window.open('https://ori.nic.in', '_blank')">Farmer Id Enquiry</button>
      <button onclick="window.open('https://odisha.gov.in', '_blank')">Krushak Odisha</button>
      <button onclick="window.open('https://agriodisha.nic.in', '_blank')">Target Check</button>
      <button onclick="window.open('https://odisha.gov.in', '_blank')">Sugam Odisha</button>
      <button onclick="window.open('https://odishafarmmachinery.nic.in', '_blank')">Permit Generation</button>
      <button onclick="window.open('https://odishafarmmachinery.nic.in', '_blank')">Permit Reprint</button>
      <button onclick="window.open('https://odishafarmmachinery.nic.in', '_blank')">Full Cost Payment</button>
      <button onclick="window.open('https://odishafarmmachinery.nic.in', '_blank')">Track Payment Status</button>
      <button onclick="window.open('https://odishafarmmachinery.nic.in', '_blank')">Permit Status</button>
      <button onclick="window.open('https://odishafarmmachinery.nic.in', '_blank')">Dealer Login</button>
      <button onclick="window.open('https://ori.nic.in', '_blank')">Agrisnet</button>
      <button onclick="window.open('https://agriodisha.nic.in', '_blank')">Farm Machinery</button>
    </div>
  </div>

  <!-- Upgraded Dual-Map Sticky Footer Grid -->
  <footer>
    <div class="footer-content">
      
      <!-- Left Column Column Block: Contacts & Corporate Brand Info -->
      <div class="footer-details">
        <p class="logo-line"> 
            <img src="MAA SANTOSHI AGRO LOGO.jpg" alt="Maa Santoshi Agro Logo" class="footer-logo"> 
            Maa Santoshi Agro
        </p>
        <p class="contact-line">
          <i class="fa-solid fa-phone"></i> <a href="tel:+917894675122">+91 7894675122</a>
        </p>
        <p class="contact-line">
          <i class="fa-solid fa-envelope"></i> <a href="mailto:maasantoshiagro@gmail.com">maasantoshiagro@gmail.com</a>
        </p>
        <p class="contact-line">
          <i class="fa-brands fa-whatsapp"></i> <a href="https://wa.me" target="_blank">Chat on WhatsApp</a>
        </p>
        <p class="address-line">
          <i class="fa-solid fa-location-dot"></i> At: Laikera & At: Patrapali, Kuchinda, Odisha
        </p>
      </div>

      <!-- Right Column Column Block: Double Embedded Map Containers -->
      <div class="footer-maps-grid">
        
        <!-- Map Panel 1: Laikera Branch -->
        <div class="map-box">
          <span class="map-label"><i class="fa-solid fa-store"></i> Laikera Branch</span>
          <iframe 
            src="https://google.com" 
            width="100%" 
            height="115" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

        <!-- Map Panel 2: Patrapali Branch -->
        <div class="map-box">
          <span class="map-label"><i class="fa-solid fa-warehouse"></i> Patrapali Branch</span>
          <iframe 
            src="https://google.com" 
            width="100%" 
            height="115" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

      </div>
    </div>
  </footer>

  <!-- Execution Logic Scripts -->
  <script>
    window.addEventListener('load', function() {
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      setTimeout(function(){
        preloader.style.display = 'none';
      }, 500); 
    });
  </script>

</body>
</html>
